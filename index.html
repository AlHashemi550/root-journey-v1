<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب رحلة Root - النسخة الملكية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');
        :root { --gold: #c0a060; --pink: #e91e63; --bg: #000; --paper: #f9f4e8; --maroon: #600000; }
        
        body { 
            background-color: var(--bg); margin: 0; padding: 0; 
            font-family: 'Aref Ruqaa', serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* شريط التحكم العلوي */
        .header-tools {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: #111; display: flex; justify-content: center; align-items: center;
            gap: 20px; z-index: 10000; border-bottom: 2px solid var(--gold);
        }
        .zoom-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: sans-serif; }

        /* منطقة الكتاب */
        #viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            margin-top: 60px; perspective: 2500px; padding: 20px;
        }

        #zoom-layer {
            transition: transform 0.3s ease-out; transform-origin: center center;
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
        }

        .book-frame {
            width: 100%; max-width: 900px; height: 90vh;
            position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }

        /* تنسيق الصفحات */
        .page {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; padding: 50px; box-sizing: border-box;
            display: none; border-radius: 5px;
            overflow-y: auto;
        }
        .page.active { display: block; }

        /* تصميم الغلاف الاحترافي */
        .cover-page {
            background: #000; color: #fff; border: 4px solid var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        .hacker-img {
            width: 220px; height: 220px; border-radius: 50%;
            border: 3px solid var(--gold); margin-bottom: 20px;
            box-shadow: 0 0 30px var(--pink);
            object-fit: cover;
        }

        .cover-page h1 {
            color: var(--pink); font-size: 5em; margin: 0;
            text-shadow: 0 0 25px rgba(233,30,99,0.7);
        }

        .subtitle { font-size: 1.8em; margin: 10px 0; color: #fff; line-height: 1.4; }
        .author-info { color: var(--gold); font-size: 1.5em; margin-top: 20px; }
        .footer-meta { margin-top: 20px; color: #888; font-size: 1em; }

        /* أزرار التنقل السفلية */
        .nav-bar {
            position: fixed; bottom: 20px; width: 100%;
            display: flex; justify-content: center; gap: 40px; z-index: 1000;
        }
        .nav-btn {
            background: var(--maroon); color: white; border: 2px solid var(--gold);
            padding: 12px 40px; border-radius: 50px; cursor: pointer; font-weight: bold;
            font-family: 'Aref Ruqaa', serif; font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="header-tools">
        <button class="zoom-btn" onclick="handleZoom(0.15)">ZOOM +</button>
        <span id="zVal" style="color:var(--gold); font-weight:bold; font-family:sans-serif;">100%</span>
        <button class="zoom-btn" onclick="handleZoom(-0.15)">ZOOM -</button>
    </div>

    <div id="viewport">
        <div id="zoom-layer">
            <div class="book-frame">
                
                <div class="page active cover-page">
                    <img src="https://img.freepik.com/free-vector/hooded-hacker-gaming-logo_23-2148155988.jpg" class="hacker-img">
                    <h1>رحلة Root</h1>
                    <p class="subtitle">من الصفر حتى الاحتراف في الأمن السيبراني<br><small>(Ar-En Version)</small></p>
                    
                    <div class="author-info">
                        المدون: أبو يزن الهاشمي<br>
                        الهاتف: <span dir="ltr">783234925</span>
                    </div>

                    <div class="footer-meta">
                        تاريخ الإنشاء: الجمعة، 15 مايو 2026
                    </div>
                    
                    <div style="margin-top:30px; background:var(--gold); color:#000; padding:10px 30px; border-radius:50px; font-weight:bold;">
                        انقر على "التالي" لبدء الدروس
                    </div>
                </div>

                </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="alert('أنت في الغلاف حالياً')">السابق</button>
        <button class="nav-btn" onclick="alert('جاري تجهيز الدروس الجديدة...')">التالي</button>
    </div>

    <script>
        let zoomLevel = 1.0;
        function handleZoom(val) {
            zoomLevel += val;
            if (zoomLevel < 0.5) zoomLevel = 0.5;
            document.getElementById('zoom-layer').style.transform = "scale(" + zoomLevel + ")";
            document.getElementById('zVal').innerText = Math.round(zoomLevel * 100) + "%";
        }
    </script>
</body>
</html>

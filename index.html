<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>كتاب رحلة Root - الإصدار الملكي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');
        
        :root { 
            --gold: #c0a060; --pink: #e91e63; --bg: #050505; 
            --paper: #f9f4e8; --maroon: #500000; --shadow: rgba(0,0,0,0.6);
        }

        body { 
            background: var(--bg); margin: 0; padding: 0; 
            font-family: 'Aref Ruqaa', serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* شريط التحكم العائم (Glassmorphism) */
        .controls-layer {
            position: fixed; top: 15px; width: 100%; display: flex; 
            justify-content: center; gap: 10px; z-index: 10000;
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--gold);
            backdrop-filter: blur(10px); color: var(--gold); padding: 8px 18px;
            border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .glass-btn:hover { background: var(--gold); color: #000; }

        /* منطقة العرض الذكية */
        #viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        #zoom-layer {
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-origin: center center;
            display: flex; align-items: center; justify-content: center;
        }

        .book-container {
            width: 90vw; max-width: 850px; height: 85vh;
            position: relative; perspective: 2000px;
        }

        /* الصفحة بتصميم "الختمة" الفاخر */
        .page {
            width: 100%; height: 100%; position: absolute;
            background: var(--paper); border-radius: 4px;
            box-shadow: 0 20px 50px var(--shadow), inset 15px 0 30px rgba(0,0,0,0.1);
            border-right: 12px solid var(--maroon);
            display: none; padding: 40px; box-sizing: border-box;
            overflow-y: auto;
        }
        .page.active { display: block; animation: pageFade 0.5s ease; }

        @keyframes pageFade { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* الغلاف المذهل */
        .cover {
            background: #000 url('https://www.transparenttextures.com/patterns/black-linen.png');
            border: 5px double var(--gold); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; color: #fff;
        }
        .hacker-avatar {
            width: 200px; height: 200px; border-radius: 50%;
            border: 4px solid var(--gold); margin-bottom: 20px;
            box-shadow: 0 0 40px var(--pink); object-fit: cover;
            filter: grayscale(0.2) contrast(1.2);
        }
        .glow-title {
            color: var(--pink); font-size: 5em; margin: 0;
            text-shadow: 0 0 20px var(--pink), 0 0 40px rgba(233,30,99,0.3);
        }
        .author-tag { color: var(--gold); font-size: 1.6em; margin-top: 25px; }

        /* أزرار التنقل السفلية */
        .nav-dock {
            position: fixed; bottom: 20px; width: 100%; display: flex;
            justify-content: center; gap: 40px; z-index: 1000;
        }
        .nav-link {
            background: linear-gradient(145deg, var(--maroon), #300000);
            color: #fff; border: 1px solid var(--gold); padding: 12px 45px;
            border-radius: 30px; font-family: 'Aref Ruqaa', serif; font-size: 1.3em;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="controls-layer">
        <button class="glass-btn" onclick="adjustZoom(0.1)">تكبير +</button>
        <span id="zoomPercent" style="color:var(--gold); align-self:center; width:50px; text-align:center;">100%</span>
        <button class="glass-btn" onclick="adjustZoom(-0.1)">تصغير -</button>
        <button class="glass-btn" onclick="resetToFit()">احتواء الشاشة</button>
    </div>

    <div id="viewport">
        <div id="zoom-layer">
            <div class="book-container">
                
                <div class="page active cover">
                    <img src="https://img.freepik.com/free-vector/hooded-hacker-gaming-logo_23-2148155988.jpg" class="hacker-avatar">
                    <h1 class="glow-title">رحلة Root</h1>
                    <p style="font-size: 1.5em; letter-spacing: 2px;">FROM ZERO TO HERO</p>
                    <div class="author-tag">المدون: أبو يزن الهاشمي</div>
                    <div style="color: #888; margin-top: 10px;">هاتف: 783234925 | مايو 2026</div>
                </div>

            </div>
        </div>
    </div>

    <div class="nav-dock">
        <button class="nav-link" onclick="alert('أنت في الواجهة')">السابق</button>
        <button class="nav-link" onclick="alert('الدروس قيد التجهيز المذهل...')">التالي</button>
    </div>

    <script>
        let scale = 1.0;
        const zoomLayer = document.getElementById('zoom-layer');
        const zoomText = document.getElementById('zoomPercent');

        // وظيفة احتواء الشاشة تلقائياً عند التشغيل (الذكاء الاصطناعي في العرض)
        function resetToFit() {
            const screenWidth = window.innerWidth;
            const bookWidth = 900; 
            scale = (screenWidth < 600) ? (screenWidth / bookWidth) * 0.95 : 1.0;
            apply();
        }

        function adjustZoom(delta) {
            scale += delta;
            if (scale < 0.3) scale = 0.3;
            if (scale > 3.0) scale = 3.0;
            apply();
        }

        function apply() {
            zoomLayer.style.transform = "scale(" + scale + ")";
            zoomText.innerText = Math.round(scale * 100) + "%";
        }

        // تشغيل الاحتواء التلقائي عند التحميل
        window.onload = resetToFit;
        window.onresize = resetToFit;
    </script>
</body>
</html>

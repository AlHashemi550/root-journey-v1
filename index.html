<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب رحلة Root - أبو يزن الهاشمي</title>
    <style>
        :root { --gold: #c0a060; --maroon: #600000; --bg: #000; --paper: #f9f4e8; --pink: #e91e63; }
        
        body { 
            background-color: var(--bg); margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* شريط التحكم */
        .header-tools {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: #111; display: flex; justify-content: center; align-items: center;
            gap: 20px; z-index: 10000; border-bottom: 2px solid var(--gold);
        }
        .zoom-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* منطقة الكتاب */
        #viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            margin-top: 60px; perspective: 2500px; padding: 20px;
        }

        #zoom-layer {
            transition: transform 0.3s ease-out; transform-origin: center center;
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
        }

        .book-frame {
            width: 100%; max-width: 900px; height: 90vh;
            position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }

        .page {
            background: var(--paper); color: #222;
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; padding: 60px; box-sizing: border-box;
            display: none; border-radius: 5px;
            border-right: 18px solid var(--maroon);
            box-shadow: inset 50px 0 50px -50px rgba(0,0,0,0.2); 
            overflow: hidden;
        }

        .page.active { display: block; }

        /* تصميم الغلاف (الطابع الأول الفخم) */
        .cover-design {
            background: #000;
            color: #fff;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--gold);
            position: relative;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        /* رسومات خلفية رقمية خفيفة */
        .cover-design::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.2;
        }

        .cover-design h1 {
            color: var(--pink);
            font-size: 5em;
            margin: 0;
            text-shadow: 0 0 30px rgba(233, 30, 99, 0.7);
            z-index: 2;
        }

        .cover-design .subtitle {
            font-size: 1.8em;
            margin: 20px 0;
            color: #eee;
            z-index: 2;
        }

        .cover-design .author {
            color: var(--gold);
            font-size: 1.4em;
            font-weight: bold;
            z-index: 2;
        }

        .cover-design .date {
            margin-top: 15px;
            color: #888;
            font-size: 1em;
            z-index: 2;
        }

        .start-button {
            margin-top: 50px;
            background: var(--gold);
            color: #000;
            padding: 20px 60px;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(192, 160, 96, 0.3);
            cursor: pointer;
            z-index: 2;
            transition: 0.3s;
        }

        .start-button:hover { transform: scale(1.05); }

        .nav-bar {
            position: fixed; bottom: 20px; width: 100%;
            display: flex; justify-content: center; gap: 40px; z-index: 1000;
        }
        .nav-btn {
            background: var(--maroon); color: white; border: 2px solid var(--gold);
            padding: 12px 35px; border-radius: 50px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-tools">
        <button class="zoom-btn" onclick="handleZoom(0.15)">تكبير +</button>
        <span id="zVal" style="color:var(--gold); font-weight:bold;">100%</span>
        <button class="zoom-btn" onclick="handleZoom(-0.15)">تصغير -</button>
        <button class="zoom-btn" style="background:#fff" onclick="resetZoom()">إعادة</button>
    </div>

    <div id="viewport">
        <div id="zoom-layer">
            <div class="book-frame">
                
                <div class="page active cover-design">
                    <img src="https://alhashemi550.github.io/alhashimi_root/logo.png" style="width:180px; margin-bottom:20px; z-index:2;">
                    <h1>رحلة Root</h1>
                    <p class="subtitle">من الصفر حتى الاحتراف في الأمن السيبراني</p>
                    <p class="author">المدون: أبو يزن الهاشمي</p>
                    <p class="date">تاريخ الإنشاء: مايو 2026</p>
                    <div class="start-button">ابدأ الرحلة</div>
                </div>

            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="alert('جاري إدراج الدروس الجديدة...')">السابق</button>
        <button class="nav-btn" onclick="alert('جاري إدراج الدروس الجديدة...')">التالي</button>
    </div>

    <script>
        let zoomLevel = 1.0;
        function handleZoom(val) {
            zoomLevel += val;
            if (zoomLevel < 0.5) zoomLevel = 0.5;
            document.getElementById('zoom-layer').style.transform = "scale(" + zoomLevel + ")";
            document.getElementById('zVal').innerText = Math.round(zoomLevel * 100) + "%";
        }
        function resetZoom() {
            zoomLevel = 1.0;
            document.getElementById('zoom-layer').style.transform = "scale(1)";
            document.getElementById('zVal').innerText = "100%";
        }
    </script>
</body>
</html>

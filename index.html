<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب رحلة Root - أبو يزن الهاشمي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');
        :root { --gold: #c0a060; --pink: #e91e63; --bg: #000; --paper: #f9f4e8; --maroon: #600000; }
        
        body { background: var(--bg); margin: 0; padding: 0; font-family: 'Aref Ruqaa', serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        .header-tools { position: fixed; top: 0; width: 100%; height: 60px; background: #111; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10000; border-bottom: 2px solid var(--gold); }
        .zoom-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: sans-serif; }

        #viewport { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        #zoom-layer { transition: transform 0.4s ease-out; transform-origin: center center; display: flex; align-items: center; justify-content: center; }

        .book-frame { width: 95vw; max-width: 850px; height: 85vh; position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.9); }

        .page { width: 100%; height: 100%; position: absolute; background: #000; border: 4px solid var(--gold); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; text-align: center; color: #fff; overflow: hidden; }

        /* صورة الهكر المطلوبة */
        .hacker-img { width: 220px; height: 220px; border-radius: 50%; border: 3px solid var(--gold); margin-bottom: 20px; box-shadow: 0 0 30px var(--pink); object-fit: cover; }

        h1 { color: var(--pink); font-size: 5em; margin: 0; text-shadow: 0 0 25px rgba(233,30,99,0.7); line-height: 1.2; }
        .subtitle { font-size: 1.6em; margin: 15px 0; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 10px 0; width: 85%; }
        .author-info { color: var(--gold); font-size: 1.4em; margin-top: 20px; }
        .meta { margin-top: 15px; color: #888; font-size: 0.9em; }

        .nav-bar { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 40px; z-index: 1000; }
        .nav-btn { background: var(--maroon); color: white; border: 2px solid var(--gold); padding: 12px 40px; border-radius: 50px; cursor: pointer; font-weight: bold; font-family: 'Aref Ruqaa', serif; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="header-tools">
        <button class="zoom-btn" onclick="adjustZoom(0.1)">تكبير +</button>
        <span id="zVal" style="color:var(--gold); font-weight:bold; font-family:sans-serif;">100%</span>
        <button class="zoom-btn" onclick="adjustZoom(-0.1)">تصغير -</button>
        <button class="zoom-btn" style="background:#fff" onclick="resetToFit()">الحجم التلقائي</button>
    </div>

    <div id="viewport">
        <div id="zoom-layer">
            <div class="book-frame">
                <div class="page active">
                    <img src="https://i.pinimg.com/736x/8d/f1/69/8df16923b0d2d6c1798e4d2847a972c2.jpg" class="hacker-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2592/2592317.png'">
                    <h1>رحلة Root</h1>
                    <div class="subtitle">من الصفر حتى الاحتراف في الأمن السيبراني<br>Journey of Root (From Zero to Hero)</div>
                    <div class="author-info">المدون: أبو يزن الهاشمي<br>الهاتف: 783234925</div>
                    <div class="meta">تاريخ الإنشاء: 15 مايو 2026</div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="alert('أنت في الغلاف')">السابق</button>
        <button class="nav-btn" onclick="alert('جاري إدراج الدروس الجديدة...')">التالي</button>
    </div>

    <script>
        let scale = 1.0;
        function resetToFit() {
            const screenWidth = window.innerWidth;
            scale = (screenWidth < 600) ? (screenWidth / 900) * 0.95 : 1.0;
            apply();
        }
        function adjustZoom(delta) { scale += delta; apply(); }
        function apply() {
            document.getElementById('zoom-layer').style.transform = "scale(" + scale + ")";
            document.getElementById('zVal').innerText = Math.round(scale * 100) + "%";
        }
        window.onload = resetToFit;
        window.onresize = resetToFit;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب رحلة Root - أبو يزن الهاشمي</title>
    <style>
        /* استيراد خطوط عربية شبيهة بالرقعة */
        @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');

        :root { --gold: #c0a060; --pink: #e91e63; --bg: #000; --paper: #f9f4e8; }
        
        body { 
            background-color: var(--bg); margin: 0; padding: 0; 
            font-family: 'Aref Ruqaa', serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        .header-tools {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: #111; display: flex; justify-content: center; align-items: center;
            gap: 20px; z-index: 10000; border-bottom: 2px solid var(--gold);
        }
        .zoom-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: sans-serif; }

        #viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            margin-top: 60px; perspective: 2500px; padding: 20px;
        }

        #zoom-layer {
            transition: transform 0.3s ease-out; transform-origin: center center;
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
        }

        .book-frame {
            width: 100%; max-width: 900px; height: 90vh;
            position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }

        .page {
            background: #000; color: #fff;
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; padding: 40px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; border: 4px solid var(--gold);
            overflow: hidden; text-align: center;
            background-image: 
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        /* تأثيرات تقنية في الخلفية */
        .tech-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(0deg, rgba(0, 255, 70, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 255, 70, 0.05) 1px, transparent 1px);
            background-size: 20px 20px; z-index: 1;
        }

        .hacker-icon {
            font-size: 100px; margin-bottom: 20px; z-index: 2;
            filter: drop-shadow(0 0 20px var(--pink));
        }

        h1 {
            color: var(--pink); font-size: 5.5em; margin: 0;
            text-shadow: 0 0 30px rgba(233, 30, 99, 0.8); z-index: 2;
        }

        .subtitle {
            font-size: 1.8em; margin: 15px 0; color: #fff;
            border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold);
            padding: 10px 0; width: 80%; z-index: 2;
        }

        .info-section {
            margin-top: 40px; color: var(--gold); font-size: 1.4em; z-index: 2;
        }

        .info-section p { margin: 8px 0; }

        .date-badge {
            margin-top: 20px; background: rgba(192, 160, 96, 0.1);
            padding: 5px 20px; border-radius: 20px; border: 1px solid var(--gold);
            font-size: 0.9em; color: #888; z-index: 2;
        }

        .nav-bar {
            position: fixed; bottom: 20px; width: 100%;
            display: flex; justify-content: center; gap: 40px; z-index: 1000;
        }
        .nav-btn {
            background: var(--maroon); color: white; border: 2px solid var(--gold);
            padding: 12px 35px; border-radius: 50px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-tools">
        <button class="zoom-btn" onclick="handleZoom(0.15)">ZOOM +</button>
        <span id="zVal" style="color:var(--gold); font-weight:bold; font-family:sans-serif;">100%</span>
        <button class="zoom-btn" onclick="handleZoom(-0.15)">ZOOM -</button>
    </div>

    <div id="viewport">
        <div id="zoom-layer">
            <div class="book-frame">
                
                <div class="page active">
                    <div class="tech-bg"></div>
                    
                    <div class="hacker-icon">👤💻</div>
                    
                    <h1>رحلة Root</h1>
                    <p class="subtitle">من الصفر حتى الاحتراف في الأمن السيبراني</p>
                    
                    <div class="info-section">
                        <p>المدون: <b>أبو يزن الهاشمي</b></p>
                        <p>الهاتف: <span dir="ltr">783234925</span></p>
                    </div>

                    <div class="date-badge">
                        تاريخ الإنشاء: الجمعة، 15 مايو 2026
                    </div>

                    <div style="margin-top:50px; color:rgba(255,255,255,0.3); font-family:monospace; letter-spacing: 5px;">
                        01010110 01001001 01010000
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let zoomLevel = 1.0;
        function handleZoom(val) {
            zoomLevel += val;
            if (zoomLevel < 0.5) zoomLevel = 0.5;
            document.getElementById('zoom-layer').style.transform = "scale(" + zoomLevel + ")";
            document.getElementById('zVal').innerText = Math.round(zoomLevel * 100) + "%";
        }
    </script>
</body>
</html>

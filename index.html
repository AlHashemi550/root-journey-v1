<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب رحلة Root - المطور</title>
    <style>
        :root { --gold: #c0a060; --maroon: #600000; --bg: #050505; --paper: #f9f4e8; }
        
        body { 
            background-color: var(--bg); margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* شريط التحكم */
        .header-tools {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: #111; display: flex; justify-content: center; align-items: center;
            gap: 20px; z-index: 10000; border-bottom: 2px solid var(--gold);
        }
        .zoom-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* منطقة الكتاب */
        #viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            margin-top: 60px; perspective: 2500px; padding: 20px;
        }

        #zoom-layer {
            transition: transform 0.3s ease-out; transform-origin: center center;
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
        }

        .book-frame {
            width: 100%; max-width: 900px; height: 90vh;
            position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }

        /* تصميم الصفحة الحقيقي */
        .page {
            background: var(--paper); color: #222;
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; padding: 60px; box-sizing: border-box;
            display: none; border-radius: 5px;
            border-right: 18px solid var(--maroon);
            box-shadow: inset 50px 0 50px -50px rgba(0,0,0,0.2); 
            overflow-y: auto;
        }

        .page.active { display: block; }

        /* تنسيق النصوص والجداول الموحد */
        h2 { color: var(--maroon); border-bottom: 3px solid var(--gold); padding-bottom: 10px; text-align: center; font-size: 2.2em; }
        .table-wrap { width: 100%; margin: 30px 0; border: 1px solid #ccc; border-radius: 5px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th { background: var(--maroon); color: white; padding: 15px; }
        td { padding: 15px; border: 1px solid #eee; text-align: center; font-weight: bold; }

        /* أزرار التنقل */
        .nav-bar {
            position: fixed; bottom: 20px; width: 100%;
            display: flex; justify-content: center; gap: 40px; z-index: 1000;
        }
        .nav-btn {
            background: var(--maroon); color: white; border: 2px solid var(--gold);
            padding: 12px 35px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="header-tools">
        <button class="zoom-btn" onclick="handleZoom(0.15)">تكبير +</button>
        <span id="zVal" style="color:var(--gold); font-weight:bold;">100%</span>
        <button class="zoom-btn" onclick="handleZoom(-0.15)">تصغير -</button>
        <button class="zoom-btn" style="background:#fff" onclick="resetZoom()">إعادة</button>
    </div>

    <div id="viewport">
        <div id="zoom-layer">
            <div class="book-frame" id="book-frame">
                
                <div class="page active" style="background:#000; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                    <img src="https://alhashemi550.github.io/alhashimi_root/logo.png" style="width:180px; margin-bottom:20px;">
                    <h1 style="color:#e91e63; font-size:4em;">رحلة Root</h1>
                    <p style="font-size:1.5em; color:var(--gold);">إصدار 2026 المطور</p>
                    <p>إعداد: أبو يزن الهاشمي</p>
                </div>

                </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="changePage(-1)">السابق</button>
        <button class="nav-btn" onclick="changePage(1)">التالي</button>
    </div>

    <script>
        let currentIdx = 0;
        const pages = document.querySelectorAll('.page');
        let zoomLevel = 1.0;

        function changePage(step) {
            const nextIdx = currentIdx + step;
            if (nextIdx >= 0 && nextIdx < pages.length) {
                pages[currentIdx].classList.remove('active');
                currentIdx = nextIdx;
                pages[currentIdx].classList.add('active');
                pages[currentIdx].scrollTop = 0;
            }
        }

        function handleZoom(val) {
            zoomLevel += val;
            if (zoomLevel < 0.5) zoomLevel = 0.5;
            document.getElementById('zoom-layer').style.transform = "scale(" + zoomLevel + ")";
            document.getElementById('zVal').innerText = Math.round(zoomLevel * 100) + "%";
        }

        function resetZoom() {
            zoomLevel = 1.0;
            document.getElementById('zoom-layer').style.transform = "scale(1)";
            document.getElementById('zVal').innerText = "100%";
        }
    </script>
</body>
</html>
